[project]
name = "surnova-api"
version = "0.1.0"
description = "API REST compartida de SURNOVA Web y SURNOVAAPP"
requires-python = ">=3.12,<3.14"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"
